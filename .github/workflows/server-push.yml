name: サーバーの変更を検知

on:
  push:
    branches: [feature-websocket]
    paths:
      - 'server/**'
      - '.github/workflows/server-push.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - run: echo "サーバー関連の変更がpushされました"
      - name: Tailscaleに接続
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:kawaeyes-ci