[platformio]
default_envs=v2

[env]
platform=espressif32
framework=arduino
board=esp32-c3-devkitc-02
targets=upload ;
monitor_speed=115200
board_build.partitions=no_ota.csv ;プログラム 2MB + ファイル置き場 2MB(OTA なし)
board_build.filesystem=littlefs
lib_deps=
	lovyan03/LovyanGFX
	links2004/WebSockets
build_flags=
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

[env:v1]
build_flags=${env.build_flags} -D REV=1

[env:v2]
build_flags=${env.build_flags} -D REV=2